name: LINQ stub benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: linq-stub-pgo

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net9.0
            framework: net9.0
            tiered_pgo: "1"
          - label: net10.0
            framework: net10.0
            tiered_pgo: "1"
          - label: net10.0 + TieredPGO=0
            framework: net10.0
            tiered_pgo: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build LinqStubPgo.csproj -c Release --framework ${{ matrix.framework }}

      - name: Run benchmark
        run: dotnet run --project LinqStubPgo.csproj -c Release --framework ${{ matrix.framework }} --no-build
        env:
          DOTNET_TieredPGO: ${{ matrix.tiered_pgo }}
