name: GenericsHelpers benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: generics-helpers-lock

jobs:
  bench:
    name: ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Generate BenchmarkData.cs
        run: bash generate.sh

      - name: Build
        run: dotnet build Benchmark.csproj -c Release --framework ${{ matrix.framework }}

      - name: Run benchmark
        run: dotnet run --project Benchmark.csproj -c Release --framework ${{ matrix.framework }} --no-build
